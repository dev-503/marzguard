<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دمو ورود میهن — ایکس کارت</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <main class="mi-page">
      <header class="mi-head">
        <button class="mi-theme" type="button" aria-label="تم">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <div class="mi-brand">
          <span class="mi-brand__text">ایکس کارت<small>X CART</small></span>
          <span class="mi-brand__mark"><svg viewBox="0 0 40 40" fill="none"><path d="M8 22c5-10 18-13 26-8M10 29c6-8 14-10 21-7" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></span>
        </div>
      </header>

      <div class="mi-card">
        <form v-if="step === 'identity'" @submit.prevent="sendCode" class="mi-body">
          <h1 class="mi-title">خوش آمدید!</h1>
          <p class="mi-subtitle">برای ورود به حساب کاربری شماره موبایل خود را وارد کنید.</p>

          <label class="mi-label" for="mi-phone">شماره موبایل</label>
          <div class="mi-phone" dir="rtl" :class="{ 'mi-phone--error': error }">
            <input id="mi-phone" type="tel" inputmode="tel" dir="ltr" autocomplete="tel-national" placeholder="912 345 6789" :value="formatted" @input="onPhoneInput" :aria-invalid="error ? true : undefined">
            <span class="mi-phone__icon"><svg viewBox="0 0 24 24" fill="none"><rect x="7" y="2.5" width="10" height="19" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M11 18.5h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
          </div>
          <p class="mi-error" v-if="error">{{ error }}</p>
          <p class="mi-hint" v-else>کدی به شماره موبایل شما پیامک میشود.</p>

          <button class="mi-btn" type="submit"><span>دریافت کد ورود</span><span class="mi-btn__arrow">←</span></button>
        </form>

        <form v-else-if="step === 'otp'" @submit.prevent="verify" class="mi-body">
          <h1 class="mi-title">کد تأیید</h1>
          <p class="mi-subtitle">کد ۶ رقمی ارسال شده به <b dir="ltr">{{ masked }}</b> را وارد کنید</p>
          <div class="mi-otp" @paste="onPaste">
            <input v-for="(digit,i) in code" :key="i" :ref="function(el){ cells[i] = el }" class="mi-otp__cell" type="text" inputmode="numeric" maxlength="1" dir="ltr" :value="digit" @input="onInput(i,$event)" @keydown="onKeydown(i,$event)">
          </div>
          <p class="mi-error" v-if="error">{{ error }}</p>
          <p class="mi-demo-code" v-if="demoCode">کد دمو: <b dir="ltr">{{ demoCode }}</b></p>
          <button class="mi-btn" type="submit"><span>تایید و ورود</span><span class="mi-btn__arrow">←</span></button>
          <div class="mi-actions">
            <button type="button" class="mi-link" @click="reset">ویرایش شماره</button>
            <button type="button" class="mi-link" :disabled="countdown > 0" @click="resend">{{ countdown > 0 ? 'ارسال مجدد تا ' + countdown + ' ثانیه' : 'ارسال مجدد کد' }}</button>
          </div>
        </form>

        <div v-else class="mi-body mi-success">
          <h1 class="mi-title">با موفقیت وارد شدید</h1>
          <button class="mi-btn" type="button" @click="reset"><span>بازگشت</span><span class="mi-btn__arrow">←</span></button>
        </div>

        <a class="mi-back" href="#">بازگشت به وبسایت ایکس کارت ↗</a>
      </div>
    </main>
  </div>

  <script src="vendor/vue.global.prod.js"></script>
  <script src="app.js"></script>
</body>
</html>
